services:
  frontend:
    image: ${FRONTEND_IMAGE:?Set FRONTEND_IMAGE in frontend.deploy.env}
    container_name: northstar-frontend
    restart: unless-stopped
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in runtime.env}
      API_UPSTREAM: ${API_UPSTREAM:?Set API_UPSTREAM in runtime.env}
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 4
      start_period: 20s

volumes:
  caddy-data:
  caddy-config:
